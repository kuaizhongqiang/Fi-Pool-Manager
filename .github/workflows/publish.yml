name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write  # 推送 Docker 镜像到 ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Build in order: server → cli + plugin
      # npm workspace 将 server hoist 到根 node_modules，cli/plugin 从根解析类型
      - name: Build server
        run: npm run build --workspace=packages/server

      - name: Build cli + plugin
        run: npm run build --workspace=packages/cli --workspace=packages/plugin

      - run: npm run test --workspace=packages/server

      # Publish to npm
      - name: Publish @fi-pool/server
        run: npm publish --workspace=packages/server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @fi-pool/cli
        run: npm publish --workspace=packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Docker build & push to ghcr.io（使用 GITHUB_TOKEN，无需外部 token）
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE:${{ github.ref_name }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest

      # Package release artifacts（每个端独立 zip 包）
      - name: Package release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging v${VERSION} artifacts..."
          mkdir -p release-artifacts

          # server: dist/ + drizzle/ + package.json
          (cd packages/server && \
           zip -r "../../release-artifacts/fi-pool-server-v${VERSION}.zip" \
             dist/ drizzle/ package.json README.md 2>/dev/null || \
           zip -r "../../release-artifacts/fi-pool-server-v${VERSION}.zip" \
             dist/ package.json)

          # cli: dist/ + package.json
          (cd packages/cli && \
           zip -r "../../release-artifacts/fi-pool-cli-v${VERSION}.zip" \
             dist/ package.json README.md 2>/dev/null || \
           zip -r "../../release-artifacts/fi-pool-cli-v${VERSION}.zip" \
             dist/ package.json)

          # plugin: dist/ + package.json
          (cd packages/plugin && \
           zip -r "../../release-artifacts/fi-pool-plugin-v${VERSION}.zip" \
             dist/ package.json README.md 2>/dev/null || \
           zip -r "../../release-artifacts/fi-pool-plugin-v${VERSION}.zip" \
             dist/ package.json)

          ls -lh release-artifacts/

      # GitHub Release（附带 zip 包）
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*.zip

name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write  # 推送 Docker 镜像到 ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Build in order: server → cli + plugin
      - name: Build server
        run: npm run build --workspace=packages/server

      - name: Build cli + plugin
        run: npm run build --workspace=packages/cli --workspace=packages/plugin

      - run: npm run test --workspace=packages/server

      # Publish to npm
      - name: Publish @fi-pool/server
        run: npm publish --workspace=packages/server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @fi-pool/cli
        run: npm publish --workspace=packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Docker build & push to ghcr.io（使用 GITHUB_TOKEN，无需外部 token）
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker build -t $IMAGE:${{ github.ref_name }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest

      # GitHub Release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

name: CI

on:
  push:
    branches: [main, develop, 'phase/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages (server first)
        run: |
          npm run build --workspace=packages/server
          for pkg in packages/cli packages/plugin; do
            mkdir -p "$pkg/node_modules/fi-pool-server"
            rm -rf "$pkg/node_modules/fi-pool-server/dist"
            cp -r packages/server/dist "$pkg/node_modules/fi-pool-server/dist"
            cp packages/server/package.json "$pkg/node_modules/fi-pool-server/package.json"
          done
          npm run build --workspace=packages/cli --workspace=packages/plugin

      - name: Type check (needs build artifacts from previous step)
        run: npm run lint

      - name: Run tests
        run: npm run test --workspace=packages/server

      - name: Run test coverage
        run: npm run test:coverage --workspace=packages/server

      # E2E 测试需要 LM Studio + DashScope 真实 API，仅在配置了环境变量时运行
      - name: Run E2E tests (API-dependent)
        if: env.LLM_BASE_URL != '' || env.DASHSCOPE_API_KEY != ''
        run: npx tsx packages/server/tests/e2e/full-pipeline.e2e.ts --skip-pipeline

      - name: Upload coverage to Actions Summary
        run: |
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          cat packages/server/coverage/coverage-summary.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No coverage report found" >> $GITHUB_STEP_SUMMARY

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          echo "::group::Checking commit messages"
          git log --format="%s" "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" | while read -r line; do
            echo "Checking: $line"
            if ! echo "$line" | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z]+\))?!?:\s'; then
              if ! echo "$line" | grep -qE '^(Merge|WIP|fixup!|squash!)\s'; then
                echo "::warning::Commit message does not follow Conventional Commits: $line"
              fi
            fi
          done
          echo "::endgroup::"

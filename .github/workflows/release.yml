name: Release

on:
  # 手动禁用：与手动 tag 冲突。改用 publish.yml + 手动 git tag。
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # 推送 tag / commit
      issues: write         # 创建 Release Issue（如有）
      pull-requests: write  # 创建 Release PR（如有）

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history 供 conventional-changelog 分析

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (server first)
        run: |
          npm run build --workspace=packages/server
          npm run build --workspace=packages/cli --workspace=packages/plugin

      - name: Run tests
        run: npm run test --workspace=packages/server

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

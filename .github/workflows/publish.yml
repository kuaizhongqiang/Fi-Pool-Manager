name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write  # 推送 Docker 镜像到 ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Build in order: server → cli + plugin
      - name: Build server
        run: npm run build --workspace=packages/server

      # CI 中 npm ci 会把 fi-pool-server 解析为已发布的 npm 包（非 workspace link），
      # 导致 cli/plugin 编译时使用旧版类型声明而失败。
      # 此处手动同步 server dist 到依赖方。
      - name: Sync server dist to dependent workspaces
        run: |
          for pkg in packages/cli packages/plugin; do
            rm -rf "$pkg/node_modules/fi-pool-server/dist"
            cp -r packages/server/dist "$pkg/node_modules/fi-pool-server/dist"
            cp packages/server/package.json "$pkg/node_modules/fi-pool-server/package.json"
          done

      - name: Build cli + plugin
        run: npm run build --workspace=packages/cli --workspace=packages/plugin

      - run: npm run test --workspace=packages/server

      # Publish to npm
      - name: Publish @fi-pool/server
        run: npm publish --workspace=packages/server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @fi-pool/cli
        run: npm publish --workspace=packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Docker build & push to ghcr.io（使用 GITHUB_TOKEN，无需外部 token）
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE:${{ github.ref_name }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest

      # GitHub Release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Build in order: server → cli + plugin
      - name: Build server
        run: npm run build --workspace=packages/server

      - name: Build cli + plugin
        run: npm run build --workspace=packages/cli --workspace=packages/plugin

      - run: npm run test --workspace=packages/server

      # Publish to npm
      - name: Publish @fi-pool/server
        run: npm publish --workspace=packages/server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @fi-pool/cli
        run: npm publish --workspace=packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Docker build (optional)
      # - name: Build Docker
      #   run: docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} .
      # - name: Push Docker
      #   run: docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      # GitHub Release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
